name: Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: Recovery action or human escalation
        required: true
        type: choice
        options:
          - restore_known_good_config
          - restart_test_container
          - escalate_to_human

      ref:
        description: Commit SHA to investigate or recover
        required: true

      failed_run_url:
        description: URL of the failed CI run
        required: false

permissions:
  contents: read

jobs:
  escalate:
    if: inputs.action == 'escalate_to_human'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Email escalation report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FAILED_RUN_URL: ${{ inputs.failed_run_url }}
        run: |
          python ai-agent/agent.py notify \
            --subject "[RECOVERY ESCALATED] Human investigation required" \
            --body "No safe automatic recovery was selected.
          Action: escalate_to_human
          Original failed run: $FAILED_RUN_URL
          Recovery workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          No recovery action was executed. Human investigation is required."

  recover:
    if: inputs.action != 'escalate_to_human'
    runs-on: ubuntu-latest

    # Configure required reviewers in GitHub Settings > Environments.
    environment: recovery-approval

    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply recovery action
        id: recover
        continue-on-error: true
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            restore_known_good_config|restart_test_container)
              python recovery/recovery.py --action "$ACTION"
              ;;
            *)
              echo "Unsupported recovery action"
              exit 1
              ;;
          esac

      - name: Re-run tests
        id: retest
        if: steps.recover.outcome == 'success'
        continue-on-error: true
        run: python -m pytest

      - name: Email final result
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ACTION: ${{ inputs.action }}
          FAILED_RUN_URL: ${{ inputs.failed_run_url }}
          RECOVERY_OUTCOME: ${{ steps.recover.outcome }}
          RETEST_OUTCOME: ${{ steps.retest.outcome }}
        run: |
          if [ "$RECOVERY_OUTCOME" = "success" ] && [ "$RETEST_OUTCOME" = "success" ]; then
            RESULT="SUCCEEDED"
          else
            RESULT="FAILED"
          fi

          python ai-agent/agent.py notify \
            --subject "[RECOVERY $RESULT] $ACTION" \
            --body "Action: $ACTION
          Recovery step: ${RECOVERY_OUTCOME:-not run}
          Tests after recovery: ${RETEST_OUTCOME:-not run}
          Original failed run: $FAILED_RUN_URL
          Recovery run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail if recovery or validation failed
        if: steps.recover.outcome != 'success' || steps.retest.outcome != 'success'
        run: exit 1