name: Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: Recovery action or human escalation
        required: true
        type: choice
        options:
          - restore_known_good_config
          - restart_test_container
          - escalate_to_human

      ref:
        description: Commit SHA to investigate or recover
        required: true
        type: string

      failed_run_url:
        description: URL of the original failed CI run
        required: false
        type: string

permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # JOB 1: HUMAN ESCALATION
  # Approval is required before sending the notification.
  # --------------------------------------------------

  escalate:
    name: Escalate After Human Approval
    if: inputs.action == 'escalate_to_human'
    runs-on: ubuntu-latest

    environment:
      name: recovery-approval

    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send escalation email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FAILED_RUN_URL: ${{ inputs.failed_run_url }}
        run: |
          python ai-agent/agent.py notify \
            --subject "[RECOVERY ESCALATED] Human investigation required" \
            --body "Human approval was received for this escalation.
          Action: escalate_to_human
          Original failed CI run: $FAILED_RUN_URL
          Recovery workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          No automatic recovery action was executed. Human investigation is required."

  # --------------------------------------------------
  # JOB 2: AUTOMATIC RECOVERY AFTER HUMAN APPROVAL
  # --------------------------------------------------

  recover:
    name: Recover After Human Approval
    if: inputs.action != 'escalate_to_human'
    runs-on: ubuntu-latest

    environment:
      name: recovery-approval

    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply allowlisted recovery action
        id: recovery_action
        continue-on-error: true
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            restore_known_good_config|restart_test_container)
              python recovery/recovery.py --action "$ACTION"
              ;;
            *)
              echo "Unsupported recovery action: $ACTION"
              exit 1
              ;;
          esac

      - name: Re-run Python tests
        id: retest
        if: steps.recovery_action.outcome == 'success'
        continue-on-error: true
        run: python -m pytest

      - name: Send recovery result email
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ACTION: ${{ inputs.action }}
          FAILED_RUN_URL: ${{ inputs.failed_run_url }}
          RECOVERY_OUTCOME: ${{ steps.recovery_action.outcome }}
          RETEST_OUTCOME: ${{ steps.retest.outcome }}
        run: |
          if [ "$RECOVERY_OUTCOME" = "success" ] && \
             [ "$RETEST_OUTCOME" = "success" ]; then
            RESULT="SUCCEEDED"
            MESSAGE="Recovery completed and tests passed."
          else
            RESULT="FAILED"
            MESSAGE="Recovery or validation failed. Human investigation is required."
          fi

          python ai-agent/agent.py notify \
            --subject "[RECOVERY $RESULT] $ACTION" \
            --body "Recovery action: $ACTION
          Recovery step: ${RECOVERY_OUTCOME:-not run}
          Tests after recovery: ${RETEST_OUTCOME:-not run}
          Original failed CI run: $FAILED_RUN_URL
          Recovery workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Result: $MESSAGE"

      - name: Fail if recovery or validation failed
        if: always() && (steps.recovery_action.outcome != 'success' || steps.retest.outcome != 'success')
        run: exit 1